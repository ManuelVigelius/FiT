diffusion:
  pretrained_first_stage_model_path: stabilityai/sd-vae-ft-ema
  transport:
    path_type: Linear
    prediction: velocity
    loss_weight: null
    sample_eps: 1.0e-3     # clamps (1-t) in the 1/(1-t)^2 quadtree loss weight
    train_eps: 1.0e-3
    snr_type: lognorm
  sampler:
    mode: ODE
    ode:
      sampling_method: dopri5
      atol: 1.0e-06
      rtol: 0.001
      reverse: false
      likelihood: false
  network_config:
    target: fit.model.quadtree_model.QuadtreeFiT
    params:
      context_size: 256
      patch_size: 2
      in_channels: 4
      hidden_size: 1152
      depth: 36
      num_heads: 16
      mlp_ratio: 4.0
      class_dropout_prob: 0.1
      num_classes: 1000
      learn_sigma: false          # predict clean x1 only (no sigma head)
      use_swiglu: true
      use_swiglu_large: false
      q_norm: layernorm
      k_norm: layernorm
      qk_norm_weight: false
      rel_pos_embed: rope
      online_rope: true            # required: quadtree grid has fractional coords
      max_pe_len_h: 16
      max_pe_len_w: 16
      decouple: true
      ori_max_pe_len: 16
      adaln_type: lora
      adaln_lora_dim: 288
      use_size_cond: true          # learned per-leaf-size embedding (1/2/4/8)
      use_learned_resampling: false  # ablation toggle: false = raw patch embed/head
      # pretrain_ckpt: checkpoints/fitv2_xl.safetensors

data:
  target: fit.data.in1k_quadtree_latent_dataset.INQuadtreeLatentLoader
  params:
    train:
      data_path: datasets/imagenet1k_latents_256_sd_vae_ft_ema
      crop: 32
      max_tokens: 1024
      pad_to_multiple: 128
      quadtree_threshold: 0.5      # variance cut for compressibility
      snr_type: lognorm
      latent_channels: 4
      seed: 42
      loader:
        num_workers: 4
        raw_batch_size: 64
      # Frozen variance predictor that decides each image's quadtree structure.
      variance_predictor:
        target: fit.quadtree_compression.variance_prediction.VariancePredictor
        params:
          latent_channels: 4
          region_sizes: ${tuple:2, 4, 8}
        ckpt: checkpoints/variance_predictor.pt

accelerate:
  gradient_accumulation_steps: 1
  mixed_precision: 'bf16'
  num_train_epochs:
  max_train_steps: 100000
  learning_rate: 1.0e-4
  learning_rate_base_batch_size: 1024   # token-budget base (matches max_tokens)
  max_grad_norm: 1.0
  optimizer:
    target: torch.optim.AdamW
    params:
      betas: ${tuple:0.9, 0.999}
      weight_decay: 0
      eps: 1.0e-8
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 200
  logger: wandb
  checkpointing_epochs: False
  checkpointing_steps: 4000
  checkpointing_steps_list: [100000]
  checkpoints_total_limit: 2
  logging_steps: 100
