# ============================================================================
# WARMUP OVERLAY — merge this ON TOP of any config_quadtree_xl_*.yaml.
#
#   --cfgdir configs/quadtree/config_quadtree_xl_learned.yaml \
#            configs/quadtree/warmup_overlay.yaml
#
# It is an overlay rather than three more full config copies because the model /
# compressor / data blocks MUST be byte-identical between the warmup and the
# full stage — the full stage resumes from the warmup's checkpoint, so any drift
# in the wiring is a silent shape mismatch at load time. Overlaying keeps a
# single source of truth for the parts that have to match.
#
# What the warmup does (paired with --freeze_pretrained on the trainer):
#   frozen   the pretrained trunk — blocks, t_embedder, y_embedder,
#            global_adaLN_modulation — plus encoder.base_proj, which was seeded
#            from the checkpoint's x_embedder.proj.
#   trained  size_embedder, final_layer, and the whole pyramid encoder/decoder.
#
# NOTE ON DURATION. The residual gates (`res_gamma`) are zero-init, so at step 0
# the pyramid *weights* get gradient scaled by zero — only the gates themselves
# move at first. The pyramid starts learning once the gates open, which is why
# this is not a 1-2k-step affair like the fitv2 size_embedder warmup. 8000 is a
# starting point; watch the loss, and watch that res_gamma is actually moving
# off zero before deciding it is long enough.
# ============================================================================
accelerate:
  # Short phase; the full run continues from here with a reset optimizer.
  max_train_steps: 8000

  # Only the new layers are training and they start from scratch, so they can
  # take a larger LR than the 1e-4 the full (trunk-included) stage uses.
  learning_rate: 3.0e-4

  # Checkpoint more often than the full run: this stage is short, and the final
  # checkpoint here is the input to the full stage.
  checkpointing_steps: 2000
  checkpointing_steps_list: [8000]
