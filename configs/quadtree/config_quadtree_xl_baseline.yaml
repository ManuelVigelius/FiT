# ============================================================================
# BASELINE: no learned compression, pretrained head.
#
# Tokens are mean-pooled quadtree leaves fed straight to the checkpoint's own
# PatchEmbedder; the readout is the checkpoint's own final_layer. The
# PyramidEncoder/PyramidDecoder are not built at all.
#
# This is the reference point for the ablation: whatever
# config_quadtree_xl_learned.yaml gains has to be measured against this.
#
# NOTE ON THE HEAD. The pretrained final_layer predicts VELOCITY, but
# train_quadtree.py supervises CLEAN X0 (see Transport._loss_quadtree, with its
# 1/(1-t)^2 weight). Loading the pretrained head therefore gives a well-scaled
# starting point, not a correct one — it has to be finetuned onto the new
# target. If you would rather start the head fresh, drop `pretrain_ckpt` and add
# `ignore_keys: [final_layer]` to keep the trunk but re-init the readout.
# ============================================================================
diffusion:
  pretrained_first_stage_model_path: stabilityai/sd-vae-ft-ema
  network_config:
    target: fit.model.quadtree_model.QuadtreeFiT
    params:
      context_size: 256
      patch_size: 2
      in_channels: 4
      hidden_size: 1152
      depth: 36
      num_heads: 16
      mlp_ratio: 4.0
      class_dropout_prob: 0.1
      num_classes: 1000
      use_swiglu: true
      use_swiglu_large: false
      q_norm: layernorm
      k_norm: layernorm
      qk_norm_weight: false
      rel_pos_embed: rope
      online_rope: true            # required: quadtree grid has fractional coords
      max_pe_len_h: 16
      max_pe_len_w: 16
      decouple: true
      ori_max_pe_len: 16
      adaln_type: lora
      adaln_lora_dim: 288
      use_size_cond: true          # learned per-leaf-size embedding (1/2/4/8)
      # 16 == in_channels * patch_size^2, so x_embedder is the checkpoint's own
      # PatchEmbedder and tokens are raw mean-pooled 2x2 patches. This is the
      # value that lets a pretrained FiT load with NO unexpected keys.
      token_input_dim: 16
      # No PyramidDecoder: final_layer keeps its 16-dim readout, which is the
      # shape the pretrained head has. (use_pyramid_decoder: true would rebuild
      # it as 1152-dim and the pretrained head could no longer be loaded.)
      use_pyramid_decoder: false
      # PRETRAINED HEAD: loads the whole checkpoint, final_layer included.
      pretrain_ckpt: checkpoints/fitv2_xl.safetensors

  # Learned compression: frozen variance predictor decides the tree (see data),
  # this module fills the tokens from the FULL-RESOLUTION latent and is trained
  # jointly with the diffusion model.
  compressor_config:
    target: fit.quadtree_compression.predictive_compressor.PredictiveVarianceCompressor
    params:
      latent_channels: 4
      c: 256                       # pyramid conv width
      d: 1152                      # token width; must match token_input_dim
      crop: 32
      pad_to_multiple: 128
      with_decoder: false          # must match use_pyramid_decoder above
      share_weights: true          # one Merge/Split shared across all levels
      # Both learned paths OFF. The compressor still runs — it is what walks the
      # quadtree and packs the sequence — but tokens are plain mean-pooled leaf
      # values and the model reads them out with its own final_layer. Nothing
      # here is trained except through the diffusion loss.
      residual_encoder: false
      residual_decoder: false

data:
  target: fit.data.in1k_quadtree_latent_dataset.INQuadtreeLatentLoader
  params:
    train:
      data_path: datasets/imagenet1k_latents_256_sd_vae_ft_ema
      crop: 32
      max_tokens: 1024
      pad_to_multiple: 128
      quadtree_threshold: 0.5      # variance cut for compressibility
      snr_type: lognorm
      latent_channels: 4
      seed: 42
      loader:
        num_workers: 4
        raw_batch_size: 64
      # Frozen variance predictor that decides each image's quadtree structure.
      variance_predictor:
        target: fit.quadtree_compression.variance_prediction.VariancePredictor
        params:
          latent_channels: 4
          region_sizes: ${tuple:2, 4, 8}
        ckpt: checkpoints/variance_predictor.pt

accelerate:
  gradient_accumulation_steps: 1
  mixed_precision: 'bf16'
  num_train_epochs:
  max_train_steps: 100000
  learning_rate: 1.0e-4
  learning_rate_base_batch_size: 1024   # token-budget base (matches max_tokens)
  max_grad_norm: 1.0
  optimizer:
    target: torch.optim.AdamW
    params:
      betas: ${tuple:0.9, 0.999}
      weight_decay: 0
      eps: 1.0e-8
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 200
  logger: wandb
  checkpointing_epochs: False
  checkpointing_steps: 4000
  checkpointing_steps_list: [100000]
  checkpoints_total_limit: 2
  logging_steps: 100
